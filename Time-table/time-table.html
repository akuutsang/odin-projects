<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="time-table.css">
    <title>Document</title>
</head>
<body>
    
<h1></h1>
<table>
    <caption>Florence's weekly lesson timetable</caption>
    <colgroup>
    <col>
    <col class="monday">
    <col class="tuesday">
    <col class="wednesday">
    <col class="thursday">
    <col class="friday">
    <col class="saturday">
    <col class="sunday">
    </colgroup>
    <tr>
        <td scope="col">&nbsp;</td>
        <th scope="col">Mon</th>
        <th scope="col" class="third" >Tues</th>
        <th scope="col">Wed</th>
        <th scope="col" class="third" >Thurs</th>
        <th scope="col" class="sixth"  >Fri</th>
        <th scope="col">Saturday</th>
        <th scope="col" >Sunday</th>
    </tr>
    <tr>
        <th scope="row"> 1st period</th>
        <td scope="row">English</td>
        <td scope="row" class="third"></td>
        <td scope="row"></td>
        <td scope="row" class="third" >German</td>
        <td scope="row" class="sixth">Dutch</td>
        <td scope="row"></td>
        <td scope="row"></td>
    </tr>
    <tr>
        <th scope="row"> 2st period</th>
        <td scope="row">English</td>
        <td scope="row" class="third">English</td>
        <td scope="row"></td>
        <td scope="row" class="third" >German</td>
        <td scope="row" class="sixth">Dutch</td>
        <td scope="row"></td>
        <td scope="row"></td>
    </tr>
    <tr>
        <th scope="row"> 3st period</th>
        <td scope="row"></td>
        <td scope="row" class="third">German</td>
        <td scope="row"></td>
        <td scope="row" class="third" >German</td>
        <td scope="row" class="sixth">Dutch</td>
        <td scope="row"></td>
        <td scope="row"></td>
    </tr>
    <tr>
        <th scope="row"> 4th period</th>
        <td scope="row"></td>
        <td scope="row" class="third">English</td>
        <td scope="row"></td>
        <td scope="row" class="third" >English</td>
        <td scope="row" class="sixth">Dutch</td>
        <td scope="row"></td>
        <td scope="row"></td>
    </tr>
</table>

</body>
</html>
